<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>咕咕星球 GuGu</title>
  <script>
    (function () {
      // Taro h5 rem 基准：designWidth=750, rootValue=40, clamp [20, 40]
      function setRem() {
        var w = document.documentElement.clientWidth || window.innerWidth || 375
        var fontSize = (w / 750) * 40
        if (fontSize < 20) fontSize = 20
        if (fontSize > 40) fontSize = 40
        document.documentElement.style.fontSize = fontSize + 'px'
      }
      setRem()
      window.addEventListener('resize', setRem)
    })()
  </script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
